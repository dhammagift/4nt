name: Manual Mod Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1,15 * *' # Запуск раз в две недели (1 и 15 числа) в 03:00 UTC

permissions:
  contents: write

concurrency:
  group: manual-mod-build
  cancel-in-progress: false

jobs:
  # Сначала синхронизируем main с upstream и проверяем, были ли новые коммиты
  sync_main:
    runs-on: ubuntu-latest
    outputs:
      repo_updated: ${{ steps.merge_step.outputs.updated }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/frankksutta/s.4nt.git || true
          git fetch upstream --depth=1

      - name: Merge upstream/main into main and push
        id: merge_step
        run: |
          git checkout main
          
          # Запоминаем текущий хэш
          OLD_HASH=$(git rev-parse HEAD)
          
          # Попытка fast-forward, иначе создаём merge-коммит
          if git merge --ff-only upstream/main; then
            echo "Fast-forwarded main from upstream"
          else
            git merge upstream/main --no-edit || true
          fi
          git push origin main
          
          # Проверяем новый хэш
          NEW_HASH=$(git rev-parse HEAD)
          
          # Сравниваем и передаем результат в outputs
          if [ "$OLD_HASH" != "$NEW_HASH" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Git repository was updated."
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No new commits in Git."
          fi

  # Затем собираем ветку mod (опираясь на результат sync_main)
  build_mod:
    needs: sync_main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod branch
        uses: actions/checkout@v4
        with:
          ref: mod
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clean old files
        run: |
          # Удаляем всё в рабочей директории, кроме .git
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

      - name: Download source (Upstream or Wget fallback)
        run: |
          if [ "${{ needs.sync_main.outputs.repo_updated }}" = "true" ]; then
            echo "Source: Git upstream. Downloading zip archive..."
            wget -qO main.zip https://github.com/frankksutta/s.4nt/archive/refs/heads/main.zip
            unzip -q main.zip
            cp -a s.4nt-main/* .
            rm -rf main.zip s.4nt-main || true
          else
            echo "Source: Live site. Fetching via wget..."
            # -r: рекурсивно, -nH: не создавать папку с именем домена, -np: не подниматься выше корня
            wget -q -m -p -nH https://s.4nt.org/ || true
          fi

      # Some sections (tv_ab, taisho, the agamas ma/da/sa/ea…) are linked only from JS objects/strings,
      # so wget -m never follows them. Collect quoted ".../index.html" and ".../" paths from the downloaded
      # pages and fetch the missing ones (and whatever they reference in turn). A plain fetcher instead of
      # a second wget: wget -m / -nc re-walks the whole site and stalls for tens of minutes.
      - name: Fetch pages linked only from JS
        run: |
          cat > /tmp/fetch_missing.py <<'PY'
          #!/usr/bin/env python3
          """BFS-fetch s.4nt.org pages that are referenced only from JS strings (wget -m skips them).
          Seeds are found by scanning every downloaded page; new pages are scanned for further references."""
          import os, re, sys, time, urllib.error, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urljoin, urlparse

          BASE = "https://s.4nt.org/"
          QUOTED = re.compile(r"""["']((?:/|\.\./|\./)?(?:[A-Za-z0-9_.-]+/)+(?:index\.html)?)["']""")
          root = "."


          def local_path(url):
              rel = urlparse(url).path.lstrip("/")
              if rel.endswith("index.html"):
                  rel = rel[: -len("index.html")]
              return rel, os.path.join(root, rel, "index.html")


          def refs(page_url, text):
              out = set()
              for ref in QUOTED.findall(text):
                  u = urlparse(urljoin(page_url, ref))
                  if u.netloc == "s.4nt.org":
                      rel, path = local_path(u.geturl())
                      if not os.path.exists(path):
                          out.add(BASE + rel)
              return out


          def fetch(url):
              rel, path = local_path(url)
              # Cloudflare now and then resets a connection; a page missed here silently drops out of mod.
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(BASE + rel, headers={"User-Agent": "Wget/1.21"})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          body = r.read()
                      break
                  except urllib.error.HTTPError as e:
                      if e.code < 500:
                          return url, None, str(e)
                      err = e
                  except Exception as e:
                      err = e
                  time.sleep(2 * (attempt + 1))
              else:
                  return url, None, str(err)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "wb") as f:
                  f.write(body)
              return url, body.decode("utf-8", "ignore"), None


          seeds = set()
          for dirpath, dirnames, filenames in os.walk(root):
              dirnames[:] = [d for d in dirnames if d != ".git"]
              for name in filenames:
                  if name.endswith(".html"):
                      path = os.path.join(dirpath, name)
                      with open(path, encoding="utf-8", errors="ignore") as f:
                          seeds |= refs(urljoin(BASE, os.path.relpath(path, root).replace(os.sep, "/")), f.read())
          print(f"missing after wget: {len(seeds)}", flush=True)

          seen, queue, ok, failed = set(), seeds, 0, []
          with ThreadPoolExecutor(8) as pool:
              while queue:
                  batch = [u for u in queue if u not in seen]
                  seen.update(batch)
                  queue = set()
                  for url, text, err in pool.map(fetch, batch):
                      if err:
                          failed.append(f"{url} {err}")
                          continue
                      ok += 1
                      queue |= refs(url, text) - seen
                  print(f"fetched {ok}, failed {len(failed)}, next {len(queue)}", flush=True)
          for f in failed:
              print("FAILED", f)
          PY
          python3 /tmp/fetch_missing.py

      - name: Prepare external structure
        run: |
          mkdir -p ../scripts/4nt
          wget -qO enrich4nt.js https://raw.githubusercontent.com/dhammagift/dg/main/scripts/4nt/enrich4nt.js
          wget -qO logo4nt_plain.png https://raw.githubusercontent.com/dhammagift/dg/main/assets/img/logo4nt_plain.png || true
          cp -f logo4nt_plain.png favicon.png || true
          wget -qO ../scripts/4nt/.gitignore https://raw.githubusercontent.com/dhammagift/dg/main/scripts/4nt/.gitignore || true
          wget -qO README.md https://raw.githubusercontent.com/dhammagift/dg/main/scripts/4nt/README.md || true

      - name: Install dependencies
        run: npm install cheerio

      - name: Execute script
        run: node enrich4nt.js .

      - name: Commit and push to mod
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # Если wget скачал то же самое, что уже лежит в ветке, git commit завершится без изменений
          git commit -m "Building update (Git: ${{ needs.sync_main.outputs.repo_updated }})" || echo "No changes to commit"
          git push origin mod || echo "Push to mod failed"

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Add README to main branch and push
        run: |
          wget -qO README.md https://raw.githubusercontent.com/dhammagift/dg/main/scripts/4nt/README.md || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Updated README.md" || echo "No changes to commit"
          git push origin main || echo "Push to main failed"
